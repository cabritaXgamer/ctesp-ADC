# Gera a documentação com o Sphinx em cada push e em cada pull request para
# os ramos principais. Qualquer aviso do Sphinx faz falhar a verificação, o
# que obriga a manter os docstrings e as páginas sem erros.
name: Documentação

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar as ferramentas de desenvolvimento
        run: python -m pip install -r requirements-dev.txt

      - name: Gerar a documentação (avisos contam como erros)
        run: python -m sphinx -W -b html docs docs/_build/html

      - name: Guardar o HTML gerado
        uses: actions/upload-artifact@v4
        with:
          name: documentacao-html
          path: docs/_build/html
