# Corre os testes automáticos em cada push e em cada pull request para os
# ramos principais. O resultado aparece no próprio pull request.
name: Testes

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Versão mínima suportada e uma versão recente.
        python: ["3.10", "3.13"]
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar o Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar as ferramentas de desenvolvimento
        run: python -m pip install -r requirements-dev.txt

      - name: Correr os testes
        run: python -m pytest
